services:
  db:
    image: mariadb:lts
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    # Wikipedia revisions are big: a batch of ~8 MB of text must fit in one packet.
    command: --max-allowed-packet=256M
    volumes:
      - dbdata:/var/lib/mysql
      # Runs once, on first start, while the volume is empty.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No "ports:" on purpose: MariaDB is only reachable inside the Docker network.

  server:
    build: ./server
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Direct access: 8000 locally; 8080 on the VPS, where Hostinger's Traefik already holds 80/443.
    ports:
      - "${APP_PORT}:8000"
    # On the VPS, Traefik (Hostinger's reverse proxy) serves https://${PUBLIC_HOST} with a
    # Let's Encrypt certificate. Locally there is no Traefik and these labels do nothing.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.timeproof.entrypoints=websecure"
      - "traefik.http.routers.timeproof.rule=Host(`${PUBLIC_HOST:-timeproof.localhost}`)"
      - "traefik.http.routers.timeproof.tls.certresolver=letsencrypt"
      - "traefik.http.services.timeproof.loadbalancer.server.port=8000"
    volumes:
      - ./web:/app/web:ro
      - ./data:/data
      # Hand-made English translations of the demo cases, shown next to the Finnish diff.
      - ./analysis/demo_cases.json:/analysis/demo_cases.json:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8000

volumes:
  dbdata:
