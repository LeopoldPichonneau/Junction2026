services:
  db:
    image: mariadb:lts
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    # Wikipedia revisions are big: a batch of ~8 MB of text must fit in one packet.
    command: --max-allowed-packet=256M
    volumes:
      - dbdata:/var/lib/mysql
      # Runs once, on first start, while the volume is empty.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No "ports:" on purpose: MariaDB is only reachable inside the Docker network.

  server:
    build: ./server
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT}:8000"
    volumes:
      - ./web:/app/web:ro
      - ./data:/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000

volumes:
  dbdata:
