<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="416" viewBox="0 0 1000 416" role="img" aria-label="TimeProof architecture: the Wikipedia history is loaded into MariaDB system-versioned tables; analysis and decision modules produce the cases; a FastAPI server serves the site and the Lens; Hermes Agent runs the live watch">
  <style>.serif{font-family:'Source Serif 4','Source Serif Pro',Georgia,'Times New Roman',serif}.sans{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.label{font-weight:600;letter-spacing:.08em}</style>
  <text class="sans label" x="20" y="24" font-size="11" fill="#565965">THE HISTORY, 2003–2026</text><rect x="20" y="40" width="200" height="84" rx="4" fill="#f2f3f7" stroke="#e1e3ea"/><text class="sans" x="34" y="66" font-size="14" font-weight="700" fill="#1c1d22">Wikipedia history</text><text class="sans" x="34" y="86" font-size="12" fill="#565965">16 parquet files</text><text class="sans" x="34" y="103" font-size="12" fill="#565965">862,076 revisions</text><rect x="280" y="40" width="200" height="84" rx="4" fill="#f2f3f7" stroke="#e1e3ea"/><text class="sans" x="294" y="66" font-size="14" font-weight="700" fill="#1c1d22">analysis/</text><text class="sans" x="294" y="86" font-size="12" fill="#565965">rules find candidate edits</text><text class="sans" x="294" y="103" font-size="12" fill="#565965">Nemotron investigates</text><rect x="540" y="40" width="200" height="84" rx="4" fill="#f2f3f7" stroke="#e1e3ea"/><text class="sans" x="554" y="66" font-size="14" font-weight="700" fill="#1c1d22">decision/</text><text class="sans" x="554" y="86" font-size="12" fill="#565965">Gemini decides</text><text class="sans" x="554" y="103" font-size="12" fill="#565965">two-model rule, exposure</text><rect x="800" y="40" width="180" height="84" rx="4" fill="#f2f3f7" stroke="#e1e3ea"/><text class="sans" x="814" y="66" font-size="14" font-weight="700" fill="#1c1d22">Cloudinary</text><text class="sans" x="814" y="86" font-size="12" fill="#565965">archived pictures</text><text class="sans" x="814" y="103" font-size="12" fill="#565965">before / after view</text><path d="M220 82H275" fill="none" stroke="#565965" stroke-width="1.5"/><path d="M269 78L275 82L269 86" fill="none" stroke="#565965" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M480 82H535" fill="none" stroke="#565965" stroke-width="1.5"/><path d="M529 78L535 82L529 86" fill="none" stroke="#565965" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M740 82H795" fill="none" stroke="#565965" stroke-width="1.5"/><path d="M789 78L795 82L789 86" fill="none" stroke="#565965" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="800" y="164" width="180" height="96" rx="4" fill="#3f74b0"/><text class="serif" x="814" y="194" font-size="19" font-weight="700" fill="#fff">MariaDB</text><text class="sans" x="814" y="216" font-size="12" fill="#fff">system-versioned tables,</text><text class="sans" x="814" y="233" font-size="12" fill="#fff">every revision stored at</text><text class="sans" x="814" y="250" font-size="12" fill="#fff">its real edit time</text><path d="M640 124V186H795" fill="none" stroke="#565965" stroke-width="1.5"/><path d="M789 182L795 186L789 190" fill="none" stroke="#565965" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text class="sans" x="652" y="178" font-size="11.5" font-style="italic" text-anchor="start" fill="#565965">import_jsonl.py</text><path d="M120 124V232H795" fill="none" stroke="#565965" stroke-width="1.5"/><path d="M789 228L795 232L789 236" fill="none" stroke="#565965" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text class="sans" x="132" y="224" font-size="11.5" font-style="italic" text-anchor="start" fill="#565965">load_versions.py writes each revision with its Wikipedia timestamp</text><text class="sans label" x="20" y="300" font-size="11" fill="#565965">LIVE WATCH AND SITE</text><rect x="20" y="316" width="200" height="84" rx="4" fill="#f2f3f7" stroke="#e1e3ea"/><text class="sans" x="34" y="342" font-size="14" font-weight="700" fill="#1c1d22">Hermes Agent</text><text class="sans" x="34" y="362" font-size="12" fill="#565965">every 10 min: new edits,</text><text class="sans" x="34" y="379" font-size="12" fill="#565965">human review on Discord</text><rect x="280" y="316" width="200" height="84" rx="4" fill="#e8f0f9" stroke="#2a6fcf"/><text class="sans" x="294" y="342" font-size="14" font-weight="700" fill="#1c1d22">server/ · FastAPI</text><text class="sans" x="294" y="362" font-size="12" fill="#565965">API, live watcher,</text><text class="sans" x="294" y="379" font-size="12" fill="#565965">serves the site</text><rect x="540" y="316" width="200" height="84" rx="4" fill="#f2f3f7" stroke="#e1e3ea"/><text class="sans" x="554" y="342" font-size="14" font-weight="700" fill="#1c1d22">web/ · the site</text><text class="sans" x="554" y="362" font-size="12" fill="#565965">cases, Time machine,</text><text class="sans" x="554" y="379" font-size="12" fill="#565965">detection quality</text><rect x="800" y="316" width="180" height="84" rx="4" fill="#f2f3f7" stroke="#e1e3ea"/><text class="sans" x="814" y="342" font-size="14" font-weight="700" fill="#1c1d22">lens/ · TimeProof Lens</text><text class="sans" x="814" y="362" font-size="12" fill="#565965">outlines the cases on</text><text class="sans" x="814" y="379" font-size="12" fill="#565965">the real Wikipedia page</text><path d="M220 358H275" fill="none" stroke="#565965" stroke-width="1.5"/><path d="M269 354L275 358L269 362" fill="none" stroke="#565965" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M480 358H535" fill="none" stroke="#565965" stroke-width="1.5"/><path d="M529 354L535 358L529 362" fill="none" stroke="#565965" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M740 358H795" fill="none" stroke="#565965" stroke-width="1.5"/><path d="M789 354L795 358L789 362" fill="none" stroke="#565965" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M380 316V288H890V266" fill="none" stroke="#565965" stroke-width="1.5"/><path d="M886 272L890 266L894 272" fill="none" stroke="#565965" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text class="sans" x="392" y="281" font-size="11.5" font-style="italic" text-anchor="start" fill="#565965">FOR SYSTEM_TIME AS OF …</text>
</svg>
