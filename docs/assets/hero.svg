      <text class="serif" x="110" y="162" font-size="46" font-style="italic" fill="#fff">on Wikipedia?</text>
    </g>
    <g>
      <text class="sans" x="112" y="200" font-size="15.5" fill="#fff">TimeProof reads every version of these articles and looks for misleading pictures, removed</text>
      <text class="sans" x="112" y="223" font-size="15.5" fill="#fff">sources and shifting words. It only publishes what it can prove.</text>
