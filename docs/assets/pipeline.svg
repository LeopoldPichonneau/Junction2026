<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="130" viewBox="0 0 1000 130" role="img" aria-label="How a case gets published: rules, Nemotron investigates, Gemini decides, two-model rule, published or sent to a human">
  <style>.serif{font-family:'Source Serif 4','Source Serif Pro',Georgia,'Times New Roman',serif}.sans{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.label{font-weight:600;letter-spacing:.08em}</style>
  <text class="sans label" x="6" y="16" font-size="11" fill="#a8abb7">HOW A CASE GETS PUBLISHED</text>
  <rect x="6" y="34" width="172" height="84" rx="4" fill="#1d1f26" stroke="#2c2e37"/><text class="sans" x="20" y="60" font-size="14" font-weight="700" fill="#eef0f5">Rules</text><text class="sans" x="20" y="80" font-size="12" fill="#a8abb7">scan 862,414 versions</text><text class="sans" x="20" y="97" font-size="12" fill="#a8abb7">→ 5,660 candidates</text><rect x="210" y="34" width="172" height="84" rx="4" fill="#1d1f26" stroke="#2c2e37"/><text class="sans" x="224" y="60" font-size="14" font-weight="700" fill="#eef0f5">Nemotron investigates</text><text class="sans" x="224" y="80" font-size="12" fill="#a8abb7">3,440 edits examined</text><text class="sans" x="224" y="97" font-size="12" fill="#a8abb7">pictures, sources, words</text><path d="M183 76H205" fill="none" stroke="#a8abb7" stroke-width="1.5"/><path d="M199 72L205 76L199 80" fill="none" stroke="#a8abb7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="414" y="34" width="172" height="84" rx="4" fill="#1d1f26" stroke="#2c2e37"/><text class="sans" x="428" y="60" font-size="14" font-weight="700" fill="#eef0f5">Gemini decides</text><text class="sans" x="428" y="80" font-size="12" fill="#a8abb7">flag, dismiss or</text><text class="sans" x="428" y="97" font-size="12" fill="#a8abb7">ask a human</text><path d="M387 76H409" fill="none" stroke="#a8abb7" stroke-width="1.5"/><path d="M403 72L409 76L403 80" fill="none" stroke="#a8abb7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="618" y="34" width="172" height="84" rx="4" fill="#1b2636" stroke="#3687eb"/><text class="sans" x="632" y="60" font-size="14" font-weight="700" fill="#eef0f5">Two-model rule</text><text class="sans" x="632" y="80" font-size="12" fill="#a8abb7">publish only if</text><text class="sans" x="632" y="97" font-size="12" fill="#a8abb7">both models agree</text><path d="M591 76H613" fill="none" stroke="#a8abb7" stroke-width="1.5"/><path d="M607 72L613 76L607 80" fill="none" stroke="#a8abb7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="822" y="34" width="172" height="84" rx="4" fill="#1d1f26" stroke="#2c2e37"/><text class="sans" x="836" y="60" font-size="14" font-weight="700" fill="#eef0f5">Published / human</text><text class="sans" x="836" y="80" font-size="12" fill="#a8abb7">97 published</text><text class="sans" x="836" y="97" font-size="12" fill="#a8abb7">245 sent to a human</text><path d="M795 76H817" fill="none" stroke="#a8abb7" stroke-width="1.5"/><path d="M811 72L817 76L811 80" fill="none" stroke="#a8abb7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
