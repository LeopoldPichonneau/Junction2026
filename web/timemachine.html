<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time machine</title>
  <meta name="description" content="TimeProof shows who is rewriting history on Wikipedia, when and how, and only publishes what it can prove.">
  <script>try{var t=localStorage.getItem("tp-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
  <link rel="stylesheet" href="tokens.css?v=15">
  <link rel="stylesheet" href="style.css?v=15">
  <script src="app.js?v=15" defer></script>
</head>
<body data-page="timemachine">
  <main>
    <h1>Time <span class="two-tone">machine</span></h1>
    <p class="lead">Read an article exactly as it stood on any date. Every version is stored in MariaDB with its real Wikipedia edit time.</p>
    <div class="controls">
      <label>Article <select id="article"></select></label>
      <label>Date <input type="date" id="as-of" min="2003-01-01" max="2026-10-01"></label>
      <button id="go" type="button">Show this date</button>
    </div>
    <section id="timeline"><p class="empty">Loading…</p></section>
    <section id="article-text"></section>
  </main>
</body>
</html>
